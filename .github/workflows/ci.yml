name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            desktop-file-utils \
            gir1.2-ayatanaappindicator3-0.1 \
            gir1.2-notify-0.7 \
            openssh-client \
            python3-cryptography \
            python3-gi \
            python3-websockets \
            python3-venv \
            shellcheck

      - name: Run unit tests
        run: |
          /usr/bin/python3 -m venv --system-site-packages "$RUNNER_TEMP/test-env"
          "$RUNNER_TEMP/test-env/bin/python" -m pip install noiseprotocol==0.3.1
          "$RUNNER_TEMP/test-env/bin/python" -m unittest discover -s tests -v

      - name: Validate Python syntax
        run: python3 -m py_compile src/*.py

      - name: Validate shell scripts
        run: shellcheck setup.sh install.sh uninstall.sh

      - name: Validate desktop entry
        run: desktop-file-validate xdg/cloudflared-quick-tunnel-indicator.desktop
