name: Release tray installers

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  VERSION: ${{ github.ref_name }}

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  linux:
    strategy:
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Build Debian package
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: |
          bash packaging/fetch-cloudflared.sh "cloudflared-linux-$ARCH" vendor
          bash packaging/build-deb.sh "${VERSION#v}" "$ARCH" "vendor/cloudflared-linux-$ARCH" release
          dpkg-deb --info "release/quick-tunnel-tray-linux-$ARCH.deb"
          dpkg-deb --extract "release/quick-tunnel-tray-linux-$ARCH.deb" package
          package/usr/libexec/cloudflared-quick-tunnel-cloudflared --version
          test -x package/usr/bin/cloudflared-quick-tunnel-indicator
          test -f package/usr/libexec/cloudflared_quick_tunnel_noise.py
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: release/*.deb
          if-no-files-found: error

  macos:
    strategy:
      matrix:
        include:
          - {arch: amd64, runner: macos-15-intel}
          - {arch: arm64, runner: macos-15}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build and verify macOS disk image
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: |
          python -m pip install -r packaging/desktop-requirements.txt
          bash packaging/fetch-cloudflared.sh "cloudflared-darwin-$ARCH.tgz" vendor
          tar -xzf "vendor/cloudflared-darwin-$ARCH.tgz" -C vendor
          python -m PyInstaller --noconfirm --windowed --name QuickTunnelTray \
            --hidden-import pystray._darwin --osx-bundle-identifier com.robitman.quicktunneltray \
            --add-binary 'vendor/cloudflared:.' --add-data 'vendor/cloudflared-LICENSE:.' --add-data 'LICENSE:.' \
            src/cloudflared_quick_tunnel_desktop.py
          app='dist/QuickTunnelTray.app'
          plist="$app/Contents/Info.plist"
          plutil -insert LSUIElement -bool YES "$plist"
          plutil -replace CFBundleShortVersionString -string "${VERSION#v}" "$plist" || plutil -insert CFBundleShortVersionString -string "${VERSION#v}" "$plist"
          plutil -replace CFBundleVersion -string "${VERSION#v}" "$plist" || plutil -insert CFBundleVersion -string "${VERSION#v}" "$plist"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/QuickTunnelTray" --self-test
          mkdir -p disk release
          mv "$app" 'disk/Cloudflare Quick Tunnel Tray.app'
          ln -s /Applications disk/Applications
          hdiutil create -volname 'Cloudflare Quick Tunnel Tray' -srcfolder disk -format UDZO "release/quick-tunnel-tray-macos-$ARCH.dmg"
          hdiutil verify "release/quick-tunnel-tray-macos-$ARCH.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: release/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fetch verified Cloudflare binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash packaging/fetch-cloudflared.sh cloudflared-windows-amd64.exe vendor
          bash packaging/fetch-cloudflared.sh cloudflared-linux-amd64 wsl
          mv vendor/cloudflared-windows-amd64.exe vendor/cloudflared.exe
          mv wsl/cloudflared-linux-amd64 wsl/cloudflared
          cp src/cloudflared_quick_tunnel_{gateway,terminal,noise}.py wsl/
      - name: Build and verify Windows installer
        shell: pwsh
        run: |
          python -m pip install -r packaging/desktop-requirements.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm --windowed --name QuickTunnelTray --hidden-import pystray._win32 --add-binary 'vendor/cloudflared.exe:.' --add-data 'vendor/cloudflared-LICENSE:.' --add-data 'LICENSE:.' --add-data 'wsl:wsl' src/cloudflared_quick_tunnel_desktop.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          & $compiler "/DTrayVersion=$($env:VERSION.TrimStart('v'))" packaging/windows.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $setup = Start-Process -FilePath release/quick-tunnel-tray-windows-amd64.exe -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-' -Wait -PassThru
          if ($setup.ExitCode) { exit $setup.ExitCode }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Cloudflare Quick Tunnel Tray\QuickTunnelTray.exe'
          $smoke = Start-Process -FilePath $app -ArgumentList '--self-test' -Wait -PassThru
          exit $smoke.ExitCode
      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: release/*.exe
          if-no-files-found: error

  publish:
    needs: [verify, linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish release and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum quick-tunnel-tray-* > SHA256SUMS
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Cloudflare Quick Tunnel Tray $VERSION" --generate-notes \
            quick-tunnel-tray-linux-{amd64,arm64}.deb quick-tunnel-tray-macos-{amd64,arm64}.dmg \
            quick-tunnel-tray-windows-amd64.exe SHA256SUMS
